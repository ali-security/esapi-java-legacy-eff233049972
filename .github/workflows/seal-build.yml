name: seal-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build jar
        run: mvn -B -V package
      - uses: actions/upload-artifact@v4
        with:
          name: esapi-jar
          path: target/esapi-2.2.0.0.jar
          if-no-files-found: error
